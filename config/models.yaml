# Model registry: aliases -> provider + model id + capabilities + pricing.
#
# Model IDs change often. Verify the IDs below against each provider before relying on
# them (`m3ds models probe` lists what your API keys can actually see), and override
# here rather than in code.
#
# Prices are USD per million tokens and are used only for cost tracking.

routes:
  # task -> ordered list of aliases. The first alias whose provider is configured
  # (has an API key) is used; the rest are fallbacks on retryable errors.
  chat: [claude, gpt, gemini]
  extract: [claude-haiku, gpt-mini, gemini-flash]
  judge: [claude, gpt, gemini]

models:
  claude:
    provider: anthropic
    model_id: claude-opus-5-5
    context_window: 1000000
    max_output_tokens: 128000
    default_max_output_tokens: 16000
    supports: {tools: true, vision: true, structured_output: true, effort: true, prompt_caching: true, temperature: false}
    price: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
    options:
      # Anthropic server-side refusal fallback (beta): the API re-runs a declined
      # request on another Claude model inside the same call.
      server_fallback: true

  claude-sonnet:
    provider: anthropic
    model_id: claude-sonnet-5-5
    context_window: 1000000
    max_output_tokens: 128000
    default_max_output_tokens: 16000
    supports: {tools: true, vision: true, structured_output: true, effort: true, prompt_caching: true, temperature: false}
    price: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}

  claude-haiku:
    provider: anthropic
    model_id: claude-haiku-5-5
    context_window: 1000000
    max_output_tokens: 128000
    default_max_output_tokens: 8000
    supports: {tools: true, vision: true, structured_output: true, effort: true, prompt_caching: true, temperature: false}
    price: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}

  gpt:
    provider: openai
    model_id: gpt-5.6-sol          # verify
    context_window: 400000
    max_output_tokens: 128000
    default_max_output_tokens: 16000
    supports: {tools: true, vision: true, structured_output: true, effort: true, prompt_caching: true, temperature: false}

  gpt-mini:
    provider: openai
    model_id: gpt-5.4-mini         # verify
    context_window: 400000
    max_output_tokens: 128000
    default_max_output_tokens: 8000
    supports: {tools: true, vision: true, structured_output: true, effort: true, prompt_caching: true, temperature: false}

  gemini:
    provider: gemini
    model_id: gemini-3.1-pro-preview   # verify
    context_window: 1000000
    max_output_tokens: 65536
    default_max_output_tokens: 16000
    supports: {tools: true, vision: true, structured_output: true, effort: true, prompt_caching: true, temperature: true}

  gemini-flash:
    provider: gemini
    model_id: gemini-3.8-flash         # verify
    context_window: 1000000
    max_output_tokens: 65536
    default_max_output_tokens: 8000
    supports: {tools: true, vision: true, structured_output: true, effort: true, prompt_caching: true, temperature: true}

  # Deterministic offline provider for development and tests.
  fake:
    provider: fake
    model_id: fake-echo
    context_window: 100000
    max_output_tokens: 4096
    default_max_output_tokens: 1024
    supports: {tools: true, vision: false, structured_output: true, effort: false, prompt_caching: false, temperature: false}
